<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Downloader</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <link rel="icon" href="Image/Icon.ico">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
<div class="container">
    <header>
        <a class="logo" href="https://www.youtube.com/" target="_blank">
            <img src="Image/partOfLogo.png" alt="part of logo"></a>
        <div class="app-name">
            <h1>YouTube Downloader</h1>
            <button class="settings-button" id="open-settings-button"></button>
        </div>
    </header>
    <main>
        <div class="input-field">
            <input type="text" class="text-box" id="url-input-field" placeholder="Video url" autocomplete="off">
            <details class="selection resolutions" id="resolutions">
                <summary>
                    <img src="Image/monitorIcon.png" alt="monitor icon">
                    <span class="selected-resolution" id="selected-resolution"></span>
                </summary>
                <ul class="available-resolutions" id="available-resolutions"></ul>
            </details>
        </div>
    </main>
    <footer>
        <p class="status" id="status"></p>
        <div class="footer-buttons-box">
            <button id="download-video">Download</button>
            <button onclick="eel.OpenVideosFolder()">Videos folder</button>
        </div>
    </footer>
</div>
<div class="settings" id="settings">
    <div class="settings__modal">
        <div class="settings__modal__header">
            <h2>Settings</h2>
            <button class="settings-button" id="close-settings-button"></button>
        </div>
        <div class="settings__modal__content">
            <div class="input-field">
                <input type="text" class="text-box" id="videos-folder" placeholder="Videos folder" autocomplete="off">
                <button class="selection" id="select-folder">
                    <img src="Image/folderIcon.png" alt="folder icon"></button>
            </div>
            <div class="theme__selector">
                <span class="theme__selector__label">Theme</span>
                <div class="theme__selector__track" id="theme-selector" role="group" aria-label="Theme">
                    <span class="theme__selector__thumb"></span>
                    <button class="theme__selector__option" id="select-dark-theme" value="dark">Dark</button>
                    <button class="theme__selector__option" id="select-light-theme" value="light">Light</button>
                </div>
            </div>
        </div>
    </div>
    <script src="JsInterlayer/settings.js"></script>
    <script src="JsInterlayer/downloader.js"></script>
</div>
</body>
</html>
